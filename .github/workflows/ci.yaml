name: CI

on:
  push:
    branches: ['develop/**', 'master']
  pull_request:
    branches: ['develop/**', 'master']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile + Checkstyle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        cache: maven
    - name: Install C Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcppunit-dev libsasl2-dev
    - name: Compile and check style
      run: mvn -B -V -e -ntp -Pfull-build verify -DskipTests checkstyle:check

  java-tests:
    name: Java Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: compile
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        cache: maven
    - name: Install C Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcppunit-dev libsasl2-dev
    - name: Run Java tests
      run: mvn -B -V -e -ntp -Pfull-build verify -Dsurefire-forkcount=4 -DskipCppUnit
    - name: Upload unit test results
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: ./**/target/surefire-reports/
        if-no-files-found: ignore
    - name: Upload integration test results
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: failsafe-reports
        path: ./**/target/failsafe-reports/
        if-no-files-found: ignore

  c-tests:
    name: C Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: compile
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        cache: maven
    - name: Install C Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcppunit-dev libsasl2-dev
    - name: Run C tests
      run: mvn -B -V -e -ntp -Pfull-build verify -Dtest=_ -Dsurefire.failIfNoSpecifiedTests=false
    - name: Upload cppunit test logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: cppunit-logs
        path: ./zookeeper-client/zookeeper-client-c/target/c/TEST-*.txt
        if-no-files-found: ignore
